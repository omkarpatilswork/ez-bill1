<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 230" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif"><title>NFC Airdrop in four steps: staff photograph the bill, attach it to the table&#x27;s tag, the guest taps their phone, and the bill is saved in EZZ BILL.</title><rect width="1280" height="230" rx="24" fill="#f1f7f3"/><rect x="28.0" y="28" width="295.5" height="174" rx="18" fill="#ffffff" stroke="#d8e9de"/><text x="50.0" y="62" fill="#15803D" font-size="14" font-weight="800" letter-spacing="2.5">1 · STAFF</text><text fill="#1d1b22" font-size="21" font-weight="800" text-anchor="start"><tspan x="50.0" y="96.0">Photograph the bill</tspan></text><text fill="#6b6670" font-size="15" font-weight="400" text-anchor="start"><tspan x="50.0" y="130.2">When the table closes, staff</tspan><tspan x="50.0" y="151.9">snap the printed bill. No POS</tspan><tspan x="50.0" y="173.7">integration needed.</tspan></text><rect x="337.5" y="28" width="295.5" height="174" rx="18" fill="#ffffff" stroke="#d8e9de"/><text x="359.5" y="62" fill="#15803D" font-size="14" font-weight="800" letter-spacing="2.5">2 · STAFF</text><text fill="#1d1b22" font-size="21" font-weight="800" text-anchor="start"><tspan x="359.5" y="96.0">Attach it to the table</tspan></text><text fill="#6b6670" font-size="15" font-weight="400" text-anchor="start"><tspan x="359.5" y="130.2">The bill is linked to that</tspan><tspan x="359.5" y="151.9">table&#x27;s NFC tag or QR code, and</tspan><tspan x="359.5" y="173.7">expires after a short window.</tspan></text><rect x="647.0" y="28" width="295.5" height="174" rx="18" fill="#ffffff" stroke="#d8e9de"/><text x="669.0" y="62" fill="#15803D" font-size="14" font-weight="800" letter-spacing="2.5">3 · GUEST</text><text fill="#1d1b22" font-size="21" font-weight="800" text-anchor="start"><tspan x="669.0" y="96.0">Tap the table</tspan></text><text fill="#6b6670" font-size="15" font-weight="400" text-anchor="start"><tspan x="669.0" y="130.2">The guest taps their phone on</tspan><tspan x="669.0" y="151.9">the tag. A service-role function</tspan><tspan x="669.0" y="173.7">returns a short-lived signed</tspan><tspan x="669.0" y="195.4">link.</tspan></text><rect x="956.5" y="28" width="295.5" height="174" rx="18" fill="#15803D"/><text x="978.5" y="62" fill="#ffffff" font-size="14" font-weight="800" letter-spacing="2.5">4 · SAVED</text><text fill="#ffffff" font-size="21" font-weight="800" text-anchor="start"><tspan x="978.5" y="96.0">Bill lands in EZZ BILL</tspan></text><text fill="#ffffff" fill-opacity="0.9" font-size="15" font-weight="400" text-anchor="start"><tspan x="978.5" y="130.2">The receipt is saved and</tspan><tspan x="978.5" y="151.9">categorised. The staff dashboard</tspan><tspan x="978.5" y="173.7">updates live over Realtime.</tspan></text></svg>